name: Experience Centre OS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    name: Test and Build Multi-Platform
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 🧪 Run Unit and Widget Tests
        run: flutter test

      - name: 🤖 Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: 🌐 Build Web Platform App
        run: flutter build web --release

      - name: 🚀 Upload Built APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experience-os-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: 🌐 Upload Web Build to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: experience-os-web
          path: build/web
